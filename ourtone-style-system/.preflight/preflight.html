<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* Ourtone 风格设计系统 — 浅色/深色双模式 Token */

:root {
  /* 品牌主色 */
  --ourtone-blue: #4A90E2;
  --ourtone-blue-50: #EDF4FC;
  --ourtone-blue-100: #D6E6F8;
  --ourtone-blue-200: #B2D0F2;
  --ourtone-blue-300: #85B4EA;
  --ourtone-blue-400: #5B9BD5;
  --ourtone-blue-500: #4A90E2;
  --ourtone-blue-600: #3A78C2;
  --ourtone-blue-700: #2E5F9E;

  /* 乐器/角色糖果色 */
  --ourtone-pink: #F5A0C0;
  --ourtone-pink-50: #FDEEF3;
  --ourtone-green: #7ED7C1;
  --ourtone-green-50: #E9F9F4;
  --ourtone-yellow: #FFD966;
  --ourtone-yellow-50: #FFF8E0;
  --ourtone-purple: #B8A9E8;
  --ourtone-purple-50: #F2EFFC;
  --ourtone-coral: #F28C8C;
  --ourtone-coral-50: #FDEBEB;

  /* 一咕业务状态色（保留） */
  --ourtone-success: #27AE60;
  --ourtone-warning: #E67E22;
  --ourtone-error: #E74C3C;
  --ourtone-info: #2E86C1;
  --ourtone-shipping: #8E44AD;
  --ourtone-soldout: #95A5A6;

  /* 角色色（一咕） */
  --ourtone-tomori: #E64545;
  --ourtone-anon: #F5A0C0;
  --ourtone-rana: #5B9BD5;
  --ourtone-taki: #9B59B6;
  --ourtone-soyo: #FFD966;

  /* 浅色模式语义 */
  --ourtone-bg: #F8FAFD;
  --ourtone-surface: #FFFFFF;
  --ourtone-surface-2: #F4F7FB;
  --ourtone-surface-3: #EDF2F8;
  --ourtone-ink: #1A1A1A;
  --ourtone-ink-2: #5A6573;
  --ourtone-ink-3: #8E9AA8;
  --ourtone-line: #E3EAF2;
  --ourtone-border: #D8E1EB;
  --ourtone-shadow: rgba(15, 39, 74, 0.08);

  /* 主色语义 */
  --ourtone-primary: var(--ourtone-blue);
  --ourtone-primary-foreground: #FFFFFF;
  --ourtone-accent: var(--ourtone-yellow);
  --ourtone-accent-foreground: #1A1A1A;

  /* 状态语义 */
  --ourtone-muted: var(--ourtone-surface-2);
  --ourtone-muted-foreground: var(--ourtone-ink-2);
  --ourtone-ring: var(--ourtone-blue-200);

  /* 形状 */
  --ourtone-radius-sm: 4px;
  --ourtone-radius-md: 8px;
  --ourtone-radius-lg: 12px;
  --ourtone-radius-xl: 16px;
  --ourtone-radius-full: 9999px;
}

html.dark {
  /* 深色模式语义 */
  --ourtone-bg: #120B0E;
  --ourtone-surface: #1A1216;
  --ourtone-surface-2: #241A1E;
  --ourtone-surface-3: #2E2227;
  --ourtone-ink: #F5F0E8;
  --ourtone-ink-2: #C9BFB5;
  --ourtone-ink-3: #948A82;
  --ourtone-line: #36282D;
  --ourtone-border: #422F36;
  --ourtone-shadow: rgba(0, 0, 0, 0.35);

  /* 深色模式强调 */
  --ourtone-primary: #6BA3E7;
  --ourtone-primary-foreground: #0F0B0E;
  --ourtone-accent: #D4A853;
  --ourtone-accent-foreground: #1A1216;
  --ourtone-ring: #6BA3E740;
}

/* 语义别名（apply-html-head-contract 与 Tailwind 语义类使用） */
:root {
  --ourtone-background: var(--ourtone-bg);
  --ourtone-foreground: var(--ourtone-ink);
  --ourtone-card: var(--ourtone-surface);
  --ourtone-card-foreground: var(--ourtone-ink);
  --ourtone-popover: var(--ourtone-surface);
  --ourtone-popover-foreground: var(--ourtone-ink);
  --ourtone-secondary: var(--ourtone-surface-2);
  --ourtone-secondary-foreground: var(--ourtone-ink-2);
  --ourtone-destructive: var(--ourtone-error);
  --ourtone-destructive-foreground: #FFFFFF;
  --ourtone-input: var(--ourtone-border);
  --ourtone-radius-small: var(--ourtone-radius-sm);
  --ourtone-radius-medium: var(--ourtone-radius-md);
  --ourtone-radius-large: var(--ourtone-radius-lg);
}

html.dark {
  --ourtone-background: var(--ourtone-bg);
  --ourtone-foreground: var(--ourtone-ink);
  --ourtone-card: var(--ourtone-surface);
  --ourtone-card-foreground: var(--ourtone-ink);
  --ourtone-popover: var(--ourtone-surface-2);
  --ourtone-popover-foreground: var(--ourtone-ink);
  --ourtone-secondary: var(--ourtone-surface-2);
  --ourtone-secondary-foreground: var(--ourtone-ink-2);
  --ourtone-destructive: var(--ourtone-error);
  --ourtone-destructive-foreground: #FFFFFF;
  --ourtone-input: var(--ourtone-border);
}

/* Tailwind v4 @theme inline */
@theme inline {
  --color-background: var(--ourtone-background);
  --color-foreground: var(--ourtone-foreground);
  --color-card: var(--ourtone-card);
  --color-card-foreground: var(--ourtone-card-foreground);
  --color-popover: var(--ourtone-popover);
  --color-popover-foreground: var(--ourtone-popover-foreground);
  --color-primary: var(--ourtone-primary);
  --color-primary-foreground: var(--ourtone-primary-foreground);
  --color-secondary: var(--ourtone-secondary);
  --color-secondary-foreground: var(--ourtone-secondary-foreground);
  --color-muted: var(--ourtone-muted);
  --color-muted-foreground: var(--ourtone-muted-foreground);
  --color-accent: var(--ourtone-accent);
  --color-accent-foreground: var(--ourtone-accent-foreground);
  --color-destructive: var(--ourtone-destructive);
  --color-destructive-foreground: var(--ourtone-destructive-foreground);
  --color-border: var(--ourtone-border);
  --color-input: var(--ourtone-input);
  --color-ring: var(--ourtone-ring);
  --radius-sm: var(--ourtone-radius-sm);
  --radius-md: var(--ourtone-radius-md);
  --radius-lg: var(--ourtone-radius-lg);
  --radius-xl: var(--ourtone-radius-xl);
  --radius-full: var(--ourtone-radius-full);
}

/* 字体系统 */
.font-display {
  font-family: Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.font-body {
  font-family: Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-weight: 400;
}

.font-mono-num {
  font-variant-numeric: tabular-nums;
}

/* 投影 */
.shadow-card {
  box-shadow: 0 2px 8px var(--ourtone-shadow);
}

.shadow-float {
  box-shadow: 0 8px 24px -6px var(--ourtone-shadow);
}

/* 半调网点背景（舞台页） */
.halftone-bg {
  background-color: var(--ourtone-bg);
  background-image: radial-gradient(circle at 2px 2px, var(--ourtone-line) 1px, transparent 0);
  background-size: 16px 16px;
}

html.dark .halftone-bg {
  background-image: radial-gradient(circle at 2px 2px, var(--ourtone-surface-2) 1px, transparent 0);
}

/* 乐器轨道渐变 */
.track-blue { background: linear-gradient(180deg, var(--ourtone-blue-300) 0%, var(--ourtone-blue-500) 100%); }
.track-pink { background: linear-gradient(180deg, var(--ourtone-pink-50) 0%, var(--ourtone-pink) 100%); }
.track-green { background: linear-gradient(180deg, var(--ourtone-green-50) 0%, var(--ourtone-green) 100%); }
.track-yellow { background: linear-gradient(180deg, var(--ourtone-yellow-50) 0%, var(--ourtone-yellow) 100%); }
.track-purple { background: linear-gradient(180deg, var(--ourtone-purple-50) 0%, var(--ourtone-purple) 100%); }

html.dark .track-blue { background: linear-gradient(180deg, #2A3A52 0%, #1E2A3D 100%); border-color: var(--ourtone-blue-400); }
html.dark .track-pink { background: linear-gradient(180deg, #3A2630 0%, #2A1B23 100%); border-color: var(--ourtone-pink); }
html.dark .track-green { background: linear-gradient(180deg, #243A35 0%, #1A2B27 100%); border-color: var(--ourtone-green); }
html.dark .track-yellow { background: linear-gradient(180deg, #3A3320 0%, #2A2516 100%); border-color: var(--ourtone-accent); }
html.dark .track-purple { background: linear-gradient(180deg, #2E2840 0%, #221D30 100%); border-color: var(--ourtone-purple); }

    </style>
